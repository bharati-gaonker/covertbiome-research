name: Bhattacharjee 2001 strict Time Machine run
on:
  push:
    branches: [time-machine-bhattacharjee-strict-run]
permissions:
  contents: read
jobs:
  strict-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - name: Resolve exact PMC attachment URLs
        run: python experiments/time_machine/probe_pmc_attachments.py
