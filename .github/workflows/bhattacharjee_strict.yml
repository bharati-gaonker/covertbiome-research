name: Bhattacharjee 2001 strict Time Machine run

on:
  push:
    branches:
      - time-machine-bhattacharjee-strict-run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy scikit-learn requests
      - name: Execute strict historical run
        run: python experiments/time_machine/bhattacharjee_strict.py
      - name: Upload frozen derived outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhattacharjee-strict-run-002
          path: strict_run_outputs/
          if-no-files-found: warn
